name: Testing matrix
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test PHP ${{ matrix.php }} on ${{ matrix.os }}
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        php:
          - 8.4
          - 8.5
          #- "8.6"
        os: [ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install composer and dependencies
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php }}
          php_extensions: xdebug mbstring gmp

      - name: PHPUnit Tests
        uses: php-actions/phpunit@v4
        env:
          XDEBUG_MODE: coverage
        with:
          bootstrap: vendor/autoload.php
          configuration: phpunit.xml
          args: tests --coverage-clover ./coverage.xml
          php_version: ${{ matrix.php }}
          php_extensions: xdebug mbstring
          memory_limit: -1
          testsuite: Rfc9421
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch comparison history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin "$PR_HEAD_SHA" "$PR_BASE_SHA"
          else
            git fetch --no-tags origin "$PR_HEAD_SHA" "$PR_BASE_SHA"
          fi

      # Existing PHP, Composer, dependency installation and coverage-driver setup steps go here.

      - name: Run Infection
        run: infection --git-diff-lines
