name: Testing matrix
on: [push, pull_request]

permissions:
  contents: read

jobs:

  test:
    name: Test PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    #needs: php-versions

    strategy:
      matrix:
        php:
          - 8.4
          - 8.5
          #- "8.6"
        os: [ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install composer and dependencies
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php }}
          php_extensions: xdebug mbstring gmp

      - name: PHPUnit Tests
        uses: php-actions/phpunit@v4
        env:
          XDEBUG_MODE: coverage
        with:
          bootstrap: vendor/autoload.php
          configuration: phpunit.xml
          args: tests --coverage-clover ./coverage.xml
          php_version: ${{ matrix.php }}
          php_extensions: xdebug mbstring
          memory_limit: -1
          testsuite: Rfc9421
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


      - name: dotnet-stryker-action
        # You may pin to the exact commit or the version.
        # uses: lyndychivs/dotnet-stryker-action@c332039c3a53e40072779bc899fd3e503eb3fefc
        uses: lyndychivs/dotnet-stryker-action@v2.1
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        with:
          configFile: "stryker-config.json"
